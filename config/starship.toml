# Original layout, emoji edition. Prompt character stays ASCII on purpose.
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
command_timeout = 1000

format = "$directory$git_branch$git_status$cmd_duration${custom.pi_thermal}$character"

[character]
error_symbol = "[x](bold red)"
success_symbol = "[>](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = ".../"
repo_root_style = "bold cyan"
read_only = " 🔒"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "🌿 "
format = "[$symbol$branch]($style) "
style = "italic blue"
truncation_length = 32
truncation_symbol = "..."

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "purple"
ahead = " ⏫ by ${count} "
behind = " ⏬ by ${count} "
diverged = " ⏫ by ${ahead_count} & ⏬ by ${behind_count} "
conflicted = " ⚠️"
up_to_date = ""
untracked = " ❓ "
modified = " ✏️ "
staged = " ✅ "
renamed = " 🏷️ "
deleted = " 🗑️ "
stashed = " 📦 "

[cmd_duration]
min_time = 2000
format = "took $duration "
style = "bold yellow"

[custom.pi_thermal]
when = true
command = 't=$(cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null); [ "${t:-0}" -ge 75000 ] && printf "🌡️ %d°C" "$((t / 1000))"'
shell = ["sh"]
format = "([$output](bold red) )"
